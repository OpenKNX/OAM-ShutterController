[RP2040_FLASH]
build_flags =
  -D KNX_FLASH_OFFSET=0x300000
  -D KNX_FLASH_SIZE=0x10000
  -D OPENKNX_FLASH_OFFSET=0x310000
  -D OPENKNX_FLASH_SIZE=0x4000
  -D EXCHANGE_FLASH_OFFSET=0x314000
  -D EXCHANGE_FLASH_SIZE=0x100000
  -D EXCHANGE_FS_SIZE=0x01000000

[custom]
build_flags = 
  -D OPENKNX_LOOPTIME_WARNING=100
  -D OPENKNX_TIME_DIGAGNOSTIC
  -D OPENKNX_SUN_POSITION
  -D OPENKNX_TIME_TESTCOMMAND
  -D OPENKNX_OVERRIDE_MASK_VERSION=0x07B0

[custom_net]
build_flags =
  -D OPENKNX_WEBSERVER
  -D OPENKNX_WEBCONSOLE
  -D OPENKNX_PING
  -D OPENKNX_WEBFS
  -D OPENKNX_MQTT
  -D OPENKNX_WEBCLIENT
  -D OPENKNX_WEBMONITOR


; debug parameters
[custom_develop]
extends = custom
build_flags = 
  ${custom.build_flags}
  -D OPENKNX_HEARTBEAT
  ; -D OPENKNX_HEARTBEAT_PRIO
  ; -D OPENKNX_RTT
  ; -D BUFFER_SIZE_UP=10240
  ; -D DEBUG_LOOP_TIME=10  ; will print a info when a loop took more than x ms.
  ; -D LOGIC_TRACE
  ; ; to see trace logs, they must match one of the 5 filters (TRACE_LOG1 .. TRACE_LOG2)
  ; "-D OPENKNX_TRACE1=Common.*"
  ; "-D OPENKNX_TRACE2=Flash.*"
debug_build_flags = 
 ; -D OPENKNX_DEBUGGER
  -ggdb3

[custom_releases]
extends = custom
build_flags =
  ${custom.build_flags}

; this config block is for specifing options that are valid for all RP2040-based builds
[RP2040_custom]
extends = RP2040, custom
; platform = https://github.com/maxgerhardt/platform-raspberrypi.git#0b2e90a
; platform_packages = framework-arduinopico @ https://github.com/earlephilhower/arduino-pico/releases/download/2.7.3/rp2040-2.7.3.zip
; board = pico
build_flags = 
  -D SERIAL_DEBUG=Serial
  -D USE_KNX_DMA_UART=0
  -D USE_KNX_DMA_IRQ=0
  -D OPENKNX_INTERNETWEATHER_IGNORE
  ; -D SERIAL_HF=Serial2
  -Wunused-variable

; ESP32
[ESP32_custom]
extends = ESP32, custom
build_flags =
  -D SERIAL_DEBUG=Serial
   ${custom_net.build_flags}
  -D OPENKNX_USB_EXCHANGE_IGNORE
  -D BOARD_HAS_PSRAM

; this config block is for specifing options that are valid for all RP2040-based develop/debug builds
[RP2040_custom_develop]
extends = RP2040_develop, RP2040_custom, custom_develop
build_flags = 
  ${RP2040_develop.build_flags}
  ${RP2040_custom.build_flags}
  ${custom_develop.build_flags}
  ${KNX_TP.build_flags}
debug_build_flags = 
  ${custom_develop.debug_build_flags}
  -O0 

; this config block is for specifing options that are valid for all RP2040-based release builds
[RP2040_custom_releases]
extends = RP2040_releases, RP2040_custom, custom_releases
build_flags = 
  ${RP2040_releases.build_flags}
  ${RP2040_custom.build_flags}
  ${custom_releases.build_flags}
  -D OPENKNX_DEBUG
  -O0
  
[RP2040_custom_releases_TP]
extends = RP2040_custom_releases
build_flags = 
  ${RP2040_custom_releases.build_flags}
  ${KNX_TP.build_flags}
 
[RP2040_custom_releases_TP_2MB]
extends = RP2040_custom_releases_TP
build_flags = 
  ${RP2040_custom_releases_TP.build_flags}
 
[RP2040_custom_releases_TP_16MB]
extends = RP2040_custom_releases_TP
build_flags = 
  ${RP2040_custom_releases_TP.build_flags}
  
[RP2040_custom_releases_IP]
extends = RP2040_custom_releases
build_flags = 
  ${RP2040_custom_releases.build_flags}
  ${KNX_IP.build_flags}
 


[env:develop_RP2040]
extends = RP2040_custom_develop
build_flags =
  ${RP2040_custom_develop.build_flags}
  -D OPENKNX_LED_TIME=info3Led
  ; -D BOARD_SMARTMF_1TE_RP2040
  ; -D BOARD_MASIFI_V40
  -D DEVICE_REG1_BASE
  ; -D OKNXHW_REG1_CONTROLLER2040_V1
