[env:develop_RP2040_SIMULATION]
extends = RP2040_custom_develop
build_flags =
  ${RP2040_custom_develop.build_flags}
  -D OPENKNX_LED_TIME=info3Led
  -D DEVICE_REG1_BASE
  -D SIMULATION
  
[env:develop_REG1_BASE_IP]
extends = RP2040_UPLOAD_USB, RP2040_custom_develop
build_flags =
  ${RP2040_custom_develop.build_flags}
  ${KNX_IP.build_flags}
    -D DEVICE_REG1_ETH
    ; -D KNX_IP_GENERIC
    ; -D KNX_IP_W5500
    -D KNX_LOG_IP
    -D OPENKNX_LED_TIME=info3Led

[env:upload_USB_RP2040]
extends = RP2040_UPLOAD_USB, env:develop_RP2040

[env:upload_JLINK_RP2040]
extends = UPLOAD_JLINK, env:develop_RP2040


; Releases


[env:release_SMARTMF_SENSORMODUL]
extends = RP2040_custom_releases_TP_16MB
build_flags =
  ${RP2040_custom_releases_TP_16MB.build_flags}
  -D DEVICE_SMARTMF_SENSORMODUL

[env:release_PiPico_BCU_Connector]
extends = RP2040_custom_releases_TP_2MB
build_flags =
  ${RP2040_custom_releases_TP_2MB.build_flags}
  -D DEVICE_PIPICO_BCU_CONNECTOR

[env:release_SMARTMF_1TE_REG]
extends = RP2040_custom_releases_TP_16MB
build_flags =
  ${RP2040_custom_releases_TP_16MB.build_flags}
  -D DEVICE_SMARTMF_1TE_REG

[env:release_OpenKNX_REG1_Controller2040]
extends = RP2040_custom_releases_TP_16MB
build_flags =
  ${RP2040_custom_releases_TP_16MB.build_flags}
  -D OKNXHW_REG1_CONTROLLER2040

[env:release_OpenKNX_REG1_BASE_V1]
extends = RP2040_custom_releases_TP_16MB
build_flags =
  ${RP2040_custom_releases_TP_16MB.build_flags}
  -D DEVICE_REG1_BASE
  -D OPENKNX_INFOLED1_DEFAULT=0
  -D OPENKNX_INFOLED2_DEFAULT=0
  -D OPENKNX_INFOLED3_DEFAULT=400

[env:release_RP2040_devel]
extends = RP2040_custom_releases_TP_2MB
build_flags =
  ${RP2040_custom_releases_TP_2MB.build_flags}
  -D DEVICE_PIPICO_BCU_CONNECTOR



; ESP32
[develop_ESP]
extends = custom, ESP32_develop
build_flags =
  ${custom.build_flags}
  ${ESP32_develop.build_flags}
  -D OPENKNX_HEARTBEAT
  -D OPENKNX_USB_EXCHANGE_IGNORE
  ;-D OPENKNX_NET_IGNORE
  ;-D OPENKNX_FILE_TRANSFER_IGNORE
  ; ; -D OPENKNX_HEARTBEAT_PRIO
  ; -D DEBUG_LOOP_TIME=10 ; will print a info when a loop took more than x ms.
  ; -D LOGIC_TRACE
  ; ; to see trace logs, they must match one of the 5 filters (TRACE_LOG1 .. TRACE_LOG2)
  ;"-D OPENKNX_TRACE1=IW.*"
  ;"-D OPENKNX_TRACE2=Logic.*"
  ;"-D OPENKNX_TRACE3=*.*"
  ; -D OPENKNX_RTT
  ; -D BUFFER_SIZE_UP=10240


[env:release_DEVICE_REG1_LAN_TP_BASE]
extends = ESP32_releases, ESP32_custom, ESP32_8MB
build_flags =
  ${KNX_TP.build_flags}
  ${ESP32_releases.build_flags}
  ${ESP32_custom.build_flags}
  ${custom_releases.build_flags}
  -D DEVICE_REG1_LAN_TP_BASE
  -D KNX_IP_LAN

[env:release_DEVICE_REG1_LAN_TP_BASE_IPonly]
extends = ESP32_releases, ESP32_custom, ESP32_8MB
build_flags =
  ${KNX_IP.build_flags}
  ${ESP32_releases.build_flags}
  ${ESP32_custom.build_flags}
  ${custom_releases.build_flags}
  -D DEVICE_REG1_LAN_TP_BASE
  -D KNX_IP_LAN

[env:release_DEVICE_REG1_LAN_BASE]
extends = ESP32_releases, ESP32_custom, ESP32_8MB
build_flags =
  ${KNX_IP.build_flags}
  ${ESP32_releases.build_flags}
  ${ESP32_custom.build_flags}
  ${custom_releases.build_flags}
  -D DEVICE_REG1_LAN_BASE
  -D KNX_IP_LAN


; ------ Adafruit ESP32 Feather V2 ------
[board_Adafruit_Feather_ESP32_V2]
extends = ESP32_8MB
build_flags =
  ${KNX_TP.build_flags}
  -D KNX_NETIF=WiFi
  -D DEVICE_ADAFRUIT_ESP32_FEATHER_V2
  -D SERIAL_DEBUG=Serial
 # -D OPENKNX_FCB_DEBUG
 -D KNX_IP_WIFI
#  -UBOARD_HAS_PSRAM
board = adafruit_feather_esp32_v2


[env:develop_Adafruit_Feather_ESP32_V2]
extends = ESP32_custom, ESP32_libs, develop_ESP, board_Adafruit_Feather_ESP32_V2
build_flags =
  ${ESP32_custom.build_flags}
  ${develop_ESP.build_flags}
  ${board_Adafruit_Feather_ESP32_V2.build_flags}


[env:develop_Adafruit_Feather_ESP32_V2_USB]
extends = env:develop_Adafruit_Feather_ESP32_V2, ESP32_UPLOAD_USB

[env:develop_Adafruit_Feather_ESP32_V2_USB_SIMULATION]
extends = env:develop_Adafruit_Feather_ESP32_V2, ESP32_UPLOAD_USB
build_flags =
 -D SIMULATION
  ${env:develop_Adafruit_Feather_ESP32_V2.build_flags}
